<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:600px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  textarea { width:100%; height:180px; background:#1b1f29; color:#eee; border:1px solid #2a2f3a; border-radius:10px; padding:14px; font-size:0.9em; resize:vertical; margin-bottom:14px; font-family:monospace; }
  .btns { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  button { padding:12px; border:none; border-radius:10px; background:#4f9dff; color:#0f1115; font-weight:bold; font-size:0.9em; }
  #error { color:#ff6b6b; margin-bottom:10px; font-size:0.9em; min-height:20px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>🧩 JSON Formatter</h1>

  <textarea id="input" placeholder='Paste your JSON here... e.g. {"name":"Ali","age":25}'></textarea>
  <div class="btns">
    <button onclick="formatJSON()">✨ Format / Beautify</button>
    <button onclick="minifyJSON()">📦 Minify</button>
  </div>
  <div id="error"></div>
  <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
</div>
<script>
  function formatJSON() {
    try {
      const obj = JSON.parse(document.getElementById('input').value);
      document.getElementById('output').value = JSON.stringify(obj, null, 2);
      document.getElementById('error').textContent = '';
    } catch (e) {
      document.getElementById('error').textContent = '❌ Invalid JSON: ' + e.message;
    }
  }
  function minifyJSON() {
    try {
      const obj = JSON.parse(document.getElementById('input').value);
      document.getElementById('output').value = JSON.stringify(obj);
      document.getElementById('error').textContent = '';
    } catch (e) {
      document.getElementById('error').textContent = '❌ Invalid JSON: ' + e.message;
    }
  }
</script>
</body>
</html>
