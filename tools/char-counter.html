<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Counter - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:600px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  textarea { width:100%; height:200px; background:#1b1f29; color:#eee; border:1px solid #2a2f3a; border-radius:10px; padding:14px; font-size:1em; resize:vertical; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px; }
  .stat { background:#1b1f29; border:1px solid #2a2f3a; border-radius:10px; padding:14px 18px; text-align:center; }
  .stat .num { font-size:1.5em; color:#4f9dff; font-weight:bold; }
  .stat .lbl { font-size:0.85em; color:#aaa; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>🔢 Character Counter</h1>
  <textarea id="txt" placeholder="Type or paste your text here..."></textarea>
  <div class="stats">
    <div class="stat"><div class="num" id="chars">0</div><div class="lbl">Characters (with spaces)</div></div>
    <div class="stat"><div class="num" id="charsNoSpace">0</div><div class="lbl">Characters (no spaces)</div></div>
    <div class="stat"><div class="num" id="words">0</div><div class="lbl">Words</div></div>
    <div class="stat"><div class="num" id="lines">0</div><div class="lbl">Lines</div></div>
  </div>
</div>
<script>
  const txt = document.getElementById('txt');
  txt.addEventListener('input', () => {
    const val = txt.value;
    document.getElementById('chars').textContent = val.length;
    document.getElementById('charsNoSpace').textContent = val.replace(/\s/g, '').length;
    document.getElementById('words').textContent = val.trim() === '' ? 0 : val.trim().split(/\s+/).length;
    document.getElementById('lines').textContent = val === '' ? 0 : val.split('\n').length;
  });
</script>
</body>
</html>
