<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:500px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  input[type=color] { width:100%; height:70px; border:none; border-radius:10px; margin-bottom:16px; background:none; }
  .row { display:flex; align-items:center; gap:10px; background:#1b1f29; border:1px solid #2a2f3a; border-radius:10px; padding:12px 16px; margin-bottom:10px; }
  .row label { width:50px; color:#aaa; font-size:0.9em; }
  .row input { flex:1; background:transparent; border:none; color:#4f9dff; font-size:1em; font-weight:bold; outline:none; }
  .copyBtn { background:#4f9dff; border:none; color:#0f1115; padding:6px 10px; border-radius:6px; font-size:0.8em; font-weight:bold; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>🎨 Color Picker</h1>

  <input type="color" id="colorInput" value="#4f9dff" oninput="updateValues()">

  <div class="row">
    <label>HEX</label>
    <input id="hexVal" readonly>
    <button class="copyBtn" onclick="copy('hexVal')">Copy</button>
  </div>
  <div class="row">
    <label>RGB</label>
    <input id="rgbVal" readonly>
    <button class="copyBtn" onclick="copy('rgbVal')">Copy</button>
  </div>
</div>
<script>
  function updateValues() {
    const hex = document.getElementById('colorInput').value;
    document.getElementById('hexVal').value = hex.toUpperCase();
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    document.getElementById('rgbVal').value = `rgb(${r}, ${g}, ${b})`;
  }
  function copy(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand('copy');
    alert('Copied: ' + el.value);
  }
  updateValues();
</script>
</body>
</html>
