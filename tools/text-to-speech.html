<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Speech - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:600px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  textarea { width:100%; height:160px; background:#1b1f29; color:#eee; border:1px solid #2a2f3a; border-radius:10px; padding:14px; font-size:1em; resize:vertical; margin-bottom:14px; }
  select { width:100%; padding:12px; border-radius:10px; border:1px solid #2a2f3a; background:#1b1f29; color:#eee; margin-bottom:14px; }
  .row { display:flex; gap:10px; margin-bottom:14px; }
  .row > div { flex:1; background:#1b1f29; border:1px solid #2a2f3a; border-radius:10px; padding:10px 14px; }
  .row label { font-size:0.8em; color:#aaa; display:block; margin-bottom:4px; }
  .btns { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  button { padding:14px; border:none; border-radius:10px; background:#4f9dff; color:#0f1115; font-weight:bold; font-size:1em; }
  #stopBtn { background:#ff4f4f; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>🔊 Text to Speech</h1>

  <textarea id="txt" placeholder="Type text to convert into speech...">Hello! This is ToolNestX text to speech tool.</textarea>

  <select id="voiceSelect"></select>

  <div class="row">
    <div><label>Rate: <span id="rateVal">1</span></label><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('rateVal').textContent=this.value" style="width:100%"></div>
    <div><label>Pitch: <span id="pitchVal">1</span></label><input type="range" id="pitch" min="0" max="2" step="0.1" value="1" oninput="document.getElementById('pitchVal').textContent=this.value" style="width:100%"></div>
  </div>

  <div class="btns">
    <button onclick="speak()">▶️ Speak</button>
    <button id="stopBtn" onclick="stop()">⏹️ Stop</button>
  </div>
</div>
<script>
  let voices = [];
  function loadVoices() {
    voices = speechSynthesis.getVoices();
    const sel = document.getElementById('voiceSelect');
    sel.innerHTML = '';
    voices.forEach((v, i) => {
      sel.innerHTML += `<option value="${i}">${v.name} (${v.lang})</option>`;
    });
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function speak() {
    const text = document.getElementById('txt').value;
    if (!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    const voiceIndex = document.getElementById('voiceSelect').value;
    if (voices[voiceIndex]) utter.voice = voices[voiceIndex];
    utter.rate = document.getElementById('rate').value;
    utter.pitch = document.getElementById('pitch').value;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }
  function stop() {
    speechSynthesis.cancel();
  }
</script>
</body>
</html>
