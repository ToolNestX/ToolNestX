<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:500px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  label { display:block; margin-bottom:6px; color:#aaa; font-size:0.9em; }
  input { width:100%; padding:14px; border-radius:10px; border:1px solid #2a2f3a; background:#1b1f29; color:#eee; font-size:1em; margin-bottom:14px; }
  button { width:100%; padding:14px; border:none; border-radius:10px; background:#4f9dff; color:#0f1115; font-weight:bold; font-size:1em; margin-bottom:16px; }
  #result { background:#1b1f29; border:1px solid #4f9dff; border-radius:10px; padding:18px; text-align:center; }
  #result .num { font-size:1.8em; color:#4f9dff; font-weight:bold; }
  #result .cat { margin-top:6px; color:#aaa; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>⚖️ BMI Calculator</h1>

  <label>Weight (kg)</label>
  <input type="number" id="weight" placeholder="e.g. 65">

  <label>Height (cm)</label>
  <input type="number" id="height" placeholder="e.g. 170">

  <button onclick="calcBMI()">Calculate BMI</button>

  <div id="result">
    <div class="num" id="bmiNum">--</div>
    <div class="cat" id="bmiCat">Enter your weight and height</div>
  </div>
</div>
<script>
  function calcBMI() {
    const w = parseFloat(document.getElementById('weight').value);
    const h = parseFloat(document.getElementById('height').value) / 100;
    if (!w || !h) return;

    const bmi = w / (h * h);
    document.getElementById('bmiNum').textContent = bmi.toFixed(1);

    let cat;
    if (bmi < 18.5) cat = 'Underweight';
    else if (bmi < 25) cat = 'Normal weight';
    else if (bmi < 30) cat = 'Overweight';
    else cat = 'Obese';

    document.getElementById('bmiCat').textContent = cat;
  }
</script>
</body>
</html>
