<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to Base64 - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:600px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  input[type=file] { width:100%; padding:14px; border-radius:10px; border:1px solid #2a2f3a; background:#1b1f29; color:#eee; margin-bottom:16px; }
  img#preview { max-width:100%; border-radius:10px; margin-bottom:16px; display:none; }
  textarea { width:100%; height:150px; background:#1b1f29; color:#4f9dff; border:1px solid #2a2f3a; border-radius:10px; padding:14px; font-size:0.85em; resize:vertical; margin-bottom:14px; word-break:break-all; }
  button { width:100%; padding:14px; border:none; border-radius:10px; background:#4f9dff; color:#0f1115; font-weight:bold; font-size:1em; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>🖼️ Image to Base64</h1>

  <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
  <img id="preview">
  <textarea id="output" placeholder="Base64 code will appear here..." readonly></textarea>
  <button onclick="copyOutput()">📋 Copy Base64 Code</button>
</div>
<script>
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      document.getElementById('output').value = reader.result;
      const img = document.getElementById('preview');
      img.src = reader.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
  function copyOutput() {
    const el = document.getElementById('output');
    el.select();
    document.execCommand('copy');
    alert('Copied!');
  }
</script>
</body>
</html>
