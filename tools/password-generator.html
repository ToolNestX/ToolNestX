<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - ToolNestX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#0f1115; color:#eee; padding:20px; }
  .back { color:#4f9dff; text-decoration:none; display:inline-block; margin-bottom:20px; }
  .wrap { max-width:500px; margin:0 auto; }
  h1 { color:#4f9dff; margin-bottom:20px; }
  #output { width:100%; padding:14px; border-radius:10px; border:1px solid #2a2f3a; background:#1b1f29; color:#4f9dff; font-size:1.2em; text-align:center; margin-bottom:16px; letter-spacing:1px; }
  .row { display:flex; align-items:center; justify-content:space-between; background:#1b1f29; border:1px solid #2a2f3a; border-radius:10px; padding:12px 16px; margin-bottom:10px; }
  .row label { display:flex; align-items:center; gap:10px; }
  input[type=range] { width:100%; }
  button { width:100%; padding:14px; border:none; border-radius:10px; background:#4f9dff; color:#0f1115; font-weight:bold; font-size:1em; margin-top:10px; }
  button:active { opacity:0.8; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back to ToolNestX</a>
  <h1>🔑 Password Generator</h1>
  <div id="output">Click Generate ↓</div>

  <div class="row">
    <label>Length: <span id="lenVal">12</span></label>
    <input type="range" id="len" min="4" max="32" value="12" oninput="document.getElementById('lenVal').textContent=this.value">
  </div>
  <div class="row"><label><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label></div>
  <div class="row"><label><input type="checkbox" id="lower" checked> Lowercase (a-z)</label></div>
  <div class="row"><label><input type="checkbox" id="num" checked> Numbers (0-9)</label></div>
  <div class="row"><label><input type="checkbox" id="sym" checked> Symbols (!@#$)</label></div>

  <button onclick="generate()">🔄 Generate Password</button>
</div>
<script>
  function generate() {
    const len = +document.getElementById('len').value;
    let chars = '';
    if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (document.getElementById('num').checked) chars += '0123456789';
    if (document.getElementById('sym').checked) chars += '!@#$%^&*()_+-=';
    if (!chars) { document.getElementById('output').textContent = 'Select at least one option'; return; }
    let pass = '';
    for (let i = 0; i < len; i++) pass += chars[Math.floor(Math.random() * chars.length)];
    document.getElementById('output').textContent = pass;
  }
</script>
</body>
</html>
